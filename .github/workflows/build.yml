name: Build site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test site
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
